{% extends "base.html" %}
{% from "_macros.html" import dashboard_cards %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1 class="h3 mb-1">Welcome, {{ g.user.display_name }}</h1>
<p class="text-muted">Policyholder</p>
{{ dashboard_cards(cards) }}
<div class="mt-4 d-flex gap-2 flex-wrap">
  <a class="btn btn-primary" href="{{ url_for('policyholder.new_claim') }}">Start a new claim</a>
  <a class="btn btn-outline-primary" href="{{ url_for('policyholder.my_policies') }}">My policies</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('claims.reports_page') }}">View report</a>
</div>
{% endblock %}
